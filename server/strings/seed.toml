# Seed page strings (seed.html).
# Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[seed.page_title]
note = "plain: browser tab title, seed page; {words} the seed's three magic words"
text = "{words} - NES Open Randomizer"

[seed.tagline]
note = "line under the magic words h1; same words show on the game's title menu and scorecard; {id} the seed's id, {created} its creation time, shown in the viewer's local time"
text = "Created: {created}"

# The seed page's link preview card, which a chat such as Discord draws under a pasted link.
# It is kept by the chat for good, and shows to players who have not played the seed.

[seed.card.title]
note = "plain: title of the seed page's link preview card; {words} the seed's three magic words"
text = "Seed: {words}"

[seed.card.description]
note = "plain: body of the seed page's link preview card; what following the link gets a player; {par} the course's par, {yards} its length in yards"
text = """
Par: {par}
Distance: {yards}
"""

# Download form. The downloaded file's name is data, not a string (server/views.py).

[seed.download.heading]
note = "h2 over the download form"
text = "Download"

[seed.download.lead]
note = "line at the top of the download form; choose a name, bag and new-save options; the ROM is patched in this browser from the ROM set up there"
text = """
Change customizable settings here and download the patched ROM.
The ROM is patched in this browser."""

[seed.download.withdrawn]
note = "seed was withdrawn by an administrator because its stored ROM should no longer be distributed; seed page, manifest and results remain available"
text = "This seed has been withdrawn by an administrator. Typically this is because the seed's ROM includes a gamebreaking bug."

[seed.download.noscript]
note = "shown only with JavaScript off; downloading needs it"
text = """
ROM patching happens completely in your browser, so this process requires JavaScript.
"""

[seed.download.guest_notice]
note = "signed out only, under the download lead; this download is a guest ROM whose scorecard can't be submitted; signing in makes a ROM that records rounds to the player's account; seed.download.guest_sign_in link follows"
text = "You're currently <mark>not signed in</mark>, so this download would be a \"Guest ROM\".  If you sign in before downloading we'll track your stats for you and tie them to your account."

[seed.download.guest_sign_in]
note = "plain: link after seed.download.guest_notice; signs in with Discord and comes back to this seed page"
text = "Log in here"

[seed.download.summary]
note = "summary line of the collapsed download settings, click to open them; what the ROM will be patched with: {name} player name, {clubs} bag size with the putter, {bgm} seed.download.bgm.* word, {swing} and {putt} seed.download.speed.* words, {spin} a seed.download.spin.* word; starts from the player's saved settings"
text = """
Name: {name}, {clubs} clubs, BGM: {bgm}, Swing: {swing}, Putt: {putt}, Spin: {spin}
"""

[seed.download.summary_no_defaults]
note = "as seed.download.summary, for an older seed whose ROM can't take swing, putt or spin defaults: {name}, {clubs} and {bgm} only"
text = """
Name: {name}, {clubs} clubs, BGM: {bgm}
"""

[seed.download.adjusted.removed]
note = "marker in the settings summary; saved clubs this seed bans were taken out of the bag, their slots left empty; {clubs} their labels"
text = """
Check club bag, this seed removed clubs: {clubs}
"""

[seed.download.adjusted.over_max]
note = "marker in the settings summary, settings start open; the bag is over this seed's limit and the download will be refused until clubs are removed; {count} clubs in the bag with the putter, {max} the limit"
text = """
Check club bag, this seed limits to {max} clubs including the putter, you have {count} selected
"""

[seed.download.name_label]
note = "label for the player name input; A-Z, '.' and space, at most 10; what a new save starts with"
text = "Player Name"

[seed.download.clubs_legend]
note = "legend over club checkboxes (1W, 3I, ...); the bag a new save starts with; putter never listed; banned clubs struck out and disabled"
text = "Club Bag"

[seed.download.clubs_help]
note = "small line under the club checkboxes; putter always carried; {max} most clubs this seed allows, putter included"
text = """
Select what clubs you want in your bag.  You'll always have a putter.
This seed's settings allow {max} clubs, including the putter.
"""

[seed.download.locked_bag]
note = "shown instead of club checkboxes when the seed has a locked bag; {clubs} its club labels, putter included"
text = """
This seed has a Locked Club Bag, with the following clubs: {clubs}
"""

[seed.download.options_legend]
note = "legend over the new-save option controls: music, and on newer seeds swing speed, putt speed and ball spin defaults; the game's club house OPTIONS screen can still change them"
text = "Player Options"

[seed.download.bgm_label]
note = "label beside the music switch; on plays course music; what a new save starts with"
text = "Course Background Music"

[seed.download.swing_label]
note = "label over the swing speed default select; the speed each full shot starts at"
text = "Default Swing Speed"

[seed.download.putt_label]
note = "label over the putt speed default select; the speed each putt starts at"
text = "Default Putt Speed"

[seed.download.spin_label]
note = "label over the ball spin default select; the spin each shot starts with"
text = "Default Swing Spin"

[seed.download.options_help]
note = "small line under the option selects; a default resets that setting at the start of every shot; off keeps whatever the player chose last, as the unmodified game does; TOP 1 and TOP 2 play as normal spin"
text = """
"Off" keeps whatever the previous swing was.  Another default will change the speed/spin at the start of the shot setup process.
"""


[seed.download.bgm.on]
note = "plain: music on, as a value in seed.download.summary"
text = "On"

[seed.download.bgm.off]
note = "plain: music off, as a value in seed.download.summary"
text = "Off"

[seed.download.speed.off]
note = "plain: select option and summary value; no default, each shot keeps the speed last chosen; the game's own behavior"
text = "Off"

[seed.download.speed.slow]
note = "plain: select option and summary value; the game's SLOW speed"
text = "Slow"

[seed.download.speed.medium]
note = "plain: select option and summary value; the game's MEDIUM speed"
text = "Medium"

[seed.download.speed.fast]
note = "plain: select option and summary value; the game's FAST speed"
text = "Fast"

[seed.download.spin.off]
note = "plain: select option and summary value; no default, each shot keeps the spin last chosen; the game's own behavior"
text = "Off"

[seed.download.spin.top2]
note = "plain: select option and summary value; the game's TOP 2 spin, which plays as normal"
text = "Top2"

[seed.download.spin.top1]
note = "plain: select option and summary value; the game's TOP 1 spin, which plays as normal"
text = "Top1"

[seed.download.spin.normal]
note = "plain: select option and summary value; the game's normal spin"
text = "Normal"

[seed.download.spin.back1]
note = "plain: select option and summary value; the game's BACK 1 spin"
text = "Back1"

[seed.download.spin.back2]
note = "plain: select option and summary value; the game's BACK 2 spin"
text = "Back2"

[seed.download.rom_setup_link]
note = "link to ROM setup; shown only while a ROM this seed needs is not set up in this browser"
text = """
Verify your ROM files here
"""

[seed.download.submit]
note = "download form submit button; builds and downloads the patched ROM"
text = "Save ROM"

# Download statuses. download.js sets these; inline HTML works, and values are escaped.

[seed.download.status.missing]
note = "download status, a ROM this seed needs isn't set up in this browser; {roms} the missing ROM titles, comma-separated"
text = """
Before saving a ROM you'll need to verify your vanilla ROM(s) for {roms}.
"""

[seed.download.status.building]
note = "download status while the server builds the patch and the browser patches the ROM"
text = "Patching..."

[seed.download.status.done]
note = "download status, patched ROM handed to the browser; {file} its file name"
text = """
ROM patched, output filename: <code>{file}</code>
"""

[seed.download.status.unavailable]
note = "download status, browser has no storage for ROMs (IndexedDB)"
text = """
Error: browser reports no storage space for patching ROM file.
"""

[seed.download.status.storage_failed]
note = "download status, browser storage wouldn't open or read; {error} the browser's error"
text = """
Browser reported storage error: {error}
"""

[seed.download.status.patch_failed]
note = "download status, the patch didn't apply to the stored ROM; {error} the error"
text = """
Error patching ROM: {error}
"""

[seed.download.status.failed]
note = "download status, request failed with no reason the page knows; {status} the HTTP status or network error"
text = """
Unknown error downloading Patch from server with status code: {status}
"""

[seed.download.status.refused.invalid_name]
note = "download refused, name can't be stored: empty, over 10 characters, or characters outside A-Z, '.' and space; {chars} the offending characters, empty when the length is the problem"
text = """
Invalid player name. Found unacceptable characters: {chars}
"""

[seed.download.status.refused.invalid]
note = "download refused, a value the form can't produce; {field} which field"
text = """
Download refused because of the {field} field
"""

[seed.download.status.refused.clubs_banned]
note = "download refused, bag holds clubs this seed bans; {clubs} their labels"
text = """
Can't save ROM, Club Bag selection contains clubs banned for this seed: {clubs}
"""

[seed.download.status.refused.clubs_over_max]
note = "download refused, bag holds too many clubs; {count} clubs chosen with the putter, {max} this seed's limit"
text = """
Can't save ROM, too many clubs in the Club Bag.  The limit is {max}, you selected {count}.
"""

[seed.download.status.refused.roms_missing]
note = "download refused by the server, a ROM this seed needs wasn't verified; {roms} their titles, comma-separated"
text = """
Couldn't verify ROM file(s): {roms}
"""

[seed.download.status.refused.seed_withdrawn]
note = "download request refused because an administrator withdrew this seed; can appear on an older cached copy of the seed page"
text = "Download failed because this seed has been withdrawn."

[seed.download.status.refused.unavailable]
note = "download refused, the server can't build ROMs right now; try later"
text = """
The server couldn't build the ROM patch right now.  Try again later.
"""

[seed.holes.heading]
note = "h2 label of the collapsed section holding the hole table"
text = "Course Overview"

[seed.holes.number]
note = "hole table column header; hole number 1-18"
text = "#"

[seed.holes.hole]
note = "hole table column header; the hole's catalog id (and name when it has one)"
text = "Hole"

[seed.holes.source]
note = "hole table column header; where the hole comes from"
text = "Source"

[seed.holes.mirrored]
note = "small marker under a hole's id; this seed mirrored the hole (flipped left to right)"
text = "(m)"

[seed.holes.hazards_shuffled]
note = "small marker under a hole's id; this seed reshuffled the hole's bunkers and water"
text = "(hs)"

[seed.holes.par]
note = "hole table column header; par"
text = "Par"

[seed.holes.distance]
note = "hole table column header; distance in yards"
text = "Distance"

[seed.holes.source_rom]
note = "hole table source cell, vanilla hole; {rom} ROM title, {course} course name, {hole} its hole number there"
text = "{rom}"

[seed.holes.source_community]
note = "hole table source cell, community hole; {author} its author"
text = "Community Hole, by {author}"

[seed.holes.total]
note = "hole table footer row label; total par and yards follow"
text = "Totals"

# Recorded rounds: every round scanned from this seed's ROMs, fewest strokes first.

[seed.rounds.heading]
note = "h2 over the rounds section while no round has been submitted for this seed, above seed.rounds.none; seed.rounds.heading_count replaces it once there are rounds"
text = "Completed Rounds"

[seed.rounds.heading_count]
note = "h2 summary of the collapsible card holding the rounds table; collapsed until the viewer has submitted a round of their own, so scores aren't spoiled before playing; {count} rounds submitted, at least 1"
text = "Completed Rounds ({count})"

[seed.rounds.hole]
note = "rounds scorecard label at the start of the header row of hole numbers, above the par row and the players' names; narrow column"
text = "Hole"

[seed.rounds.par]
note = "rounds scorecard label at the start of the header row of each hole's par (then par for each nine and the round), just above the players' rows; narrow column"
text = "Par"

[seed.rounds.player_two]
note = "rounds table player cell for a round played as player 2 on the player's ROM; {name} the ROM owner's Discord display name"
text = "Teammate - {name}"

[seed.rounds.strokes]
note = "rounds scorecard column header in the hole-number row; total strokes for the round, with the course par below in the par row; narrow column"
text = "Tot"

[seed.rounds.out]
note = "rounds scorecard column header in the hole-number row, after holes 1-9; strokes on the front nine, with its par below in the par row; narrow column"
text = "Out"

[seed.rounds.in]
note = "rounds scorecard column header in the hole-number row, after holes 10-18; strokes on the back nine, with its par below in the par row; narrow column"
text = "In"

[seed.rounds.putts]
note = "rounds table column header; total putts for the round"
text = "Putts"

[seed.rounds.flagged]
note = "marker after a round's total strokes when an admin has flagged it: the round is being questioned but still counts; short, fits in a table cell"
text = "*"

[seed.rounds.none]
note = "shown instead of the rounds table when no round has been submitted for this seed yet"
text = "Nobody's submitted a score for this seed yet."

[seed.details.heading]
note = "h2 label of the collapsed section holding the seed's settings table"
text = "Details"

[seed.details.music]
note = "settings row label; course music"
text = "Music"

[seed.details.music_value]
note = "music row value; {course} the course the theme belongs to, {rom} its ROM title"
text = "\"{course}\", {rom}"

[seed.details.par_target]
note = "settings row label; par the course was generated for"
text = "Total Par"

[seed.details.mode]
note = "settings row label; the course mode the seed was rolled with (its name follows); shown in place of the par row"
text = "Mode"

[seed.details.mode_standard]
note = "mode row value; a standard par 72"
text = "Standard"

[seed.details.mode_natural_par]
note = "mode row value; par rolled per seed, 68-76"
text = "Natural Par"

[seed.details.mode_executive]
note = "mode row value; par 3s and two to six par 4s"
text = "Executive Course"

[seed.details.mode_par_3]
note = "mode row value; eighteen par 3s"
text = "Par 3 Course"

[seed.details.mode_vanilla_course]
note = "mode row value; one cartridge course as it is; {course} its name, {rom} its ROM title"
text = "Vanilla"

[seed.details.sources]
note = "settings row label; ROMs the holes were drawn from (ROM titles follow)"
text = "Hole Sources Enabled"

[seed.details.family_repeats]
note = "settings row label; whether two versions of the same hole could share the course"
text = "Allow Family Repeats?"

[seed.details.yes]
note = "settings value; on"
text = "Yes"

[seed.details.no]
note = "settings value; off"
text = "No"

[seed.details.draw_rule]
note = "settings row label; the rule the course's holes were drawn under, about expert holes (the hardest Mario Open holes)"
text = "Expert Hole Cap"

[seed.details.draw_rule_uniform]
note = "draw rule row value; no limit on expert holes"
text = "No Limit"

[seed.details.draw_rule_no_experts]
note = "draw rule row value; expert holes left out of the course"
text = "Zero"

[seed.details.draw_rule_expert_cap]
note = "draw rule row value; at most {count} expert holes on each nine, {count} 1 or more"
text = "At most {count} per nine"

[seed.details.mirror_chance]
note = "settings row label; each hole's chance of being mirrored (the value follows)"
text = "Mirroring odds per hole"

[seed.details.hazard_chance]
note = "settings row label; each hole's chance of its bunkers and water being reshuffled (the value follows)"
text = "Hazard shuffle odds per hole"

[seed.details.chance_p0]
note = "chance row value; no hole changed"
text = "0%"

[seed.details.chance_p25]
note = "chance row value; 25% each hole; {holes} how many it changed on this seed"
text = "25% (applied to {holes} holes)"

[seed.details.chance_p50]
note = "chance row value; 50% each hole; {holes} how many it changed on this seed"
text = "50% (applied to {holes} holes)"

[seed.details.chance_p75]
note = "chance row value; 75% each hole; {holes} how many it changed on this seed"
text = "75% (applied to {holes} holes)"

[seed.details.chance_p100]
note = "chance row value; every hole; {holes} how many (18)"
text = "100%"

[seed.details.chance_percent]
note = "chance row value for an odd chance the form doesn't offer (a CLI seed); {percent} each hole's chance in %, {holes} how many it changed"
text = "{percent}% (applied to {holes} holes)"

[seed.details.wind_speed]
note = "settings row label; the seed's wind speed profile (its name follows)"
text = "Wind Speed Profile"

[seed.details.wind_direction]
note = "settings row label; the seed's wind direction profile (its name follows)"
text = "Wind Direction Profile"

[seed.details.mercy_point]
note = "settings row label; the stroke a hole ends on with an automatic tap-in"
text = "Mercy rule \"tap in\" after stroke..."

[seed.details.mercy_value]
note = "mercy row value; {stroke} the stroke number"
text = "{stroke}"

[seed.details.off]
note = "mercy row value; no tap-in rule"
text = "None!  Mercy rule disabled"

[seed.details.clubs_max]
note = "settings row label; most clubs a bag may hold, putter included"
text = "Max Clubs restriction (default is 14)"

[seed.details.banned]
note = "settings row label; clubs no bag may hold (labels follow)"
text = "Banned Clubs"

[seed.details.required_bag]
note = "settings row label; the one bag every player carries (labels follow)"
text = "Locked Bag"

[seed.details.none]
note = "settings value for banned clubs or required bag; nothing set"
text = "None (default)"

[seed.details.required_roms]
note = "settings row label; ROMs a player needs set up to download this seed (ROM titles follow)"
text = "Required ROMs"

[seed.yardage_book_link]
note = "link from the seed page to its yardage book: the rangefinder for this seed's 18 holes"
text = "Yardage Book"

[seed.manifest_link]
note = "link to the seed's manifest JSON; for the curious and for tools"
text = "manifest"
