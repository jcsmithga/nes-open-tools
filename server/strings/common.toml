# Every English string a player can see on the site, keyed. See server/CLAUDE.md,
# "Player-facing text".
#
# note  what the string has to get across, and the values it receives. Claude writes these.
# text  the string. A human writes these. Empty renders as a marked placeholder.
#
# {name} inserts a value the note lists; {{ and }} are literal braces.
# Notes starting "plain:" land in a tab title or an attribute: no HTML.
# Other entries may use inline HTML such as <a>, <code>, <strong>, <em> and <mark>.

# -- Every page -----------------------------------------------------------------------

[site.title]
note = "plain: browser tab title; default for pages without their own"
text = "NES Open Randomizer"

[site.card_name]
note = "plain: the site's name, shown small above the title of every page's link preview card (the box Discord and other chats draw under a pasted link)"
text = "NES Open Randomizer"

[site.card_description]
note = "plain: the body of a link preview card for a page without one of its own (home, ROM setup, the generate form, the rangefinder, the Markdown pages); what the site is, in a sentence or two"
text = "Play a new 18 holes every time you step onto the course."

[nav.brand]
note = "site name; left end of the nav bar, every page; also the link to the home page"
text = "NES Open Tournament Golf Randomizer"

[nav.rom]
note = "nav link to ROM setup"
text = "ROM Setup"

[nav.rom_short]
note = "nav.rom shortened, shown instead of it on a phone too narrow for the full row of nav links; as few characters as will still read as ROM setup; screen readers hear nav.rom"
text = "Setup"

[nav.generate]
note = "nav link to the seed settings form"
text = "Roll Seed"

[nav.rangefinder]
note = "nav link to the course distance measuring tool"
text = "Rangefinder"

[nav.pages]
note = "label for the dropdown of document-like pages"
text = "Pages"

[nav.sign_in]
note = "nav link to sign in with Discord; right end of the nav bar when signed out"
text = "Sign In"

[nav.signed_in_as]
note = "right end of the nav bar when signed in, a link to the player's own page (/me); receives name (the player's Discord display name)"
text = "{name}"

[nav.sign_out]
note = "button beside nav.signed_in_as that signs the player out"
text = "Sign Out"

[footer.affiliation]
note = "trademark and affiliation disclaimer shown at the bottom of every player-facing page"
text = "NES and Mario are trademarks of Nintendo. This is an unofficial fan project with no affiliation with, or endorsement by, Nintendo."
