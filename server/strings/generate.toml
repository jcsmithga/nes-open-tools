# Generate form strings (generate.html).
# Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[generate.page_title]
note = "plain: browser tab title, generate page"
text = "Randomizer - NES Open Tournament Golf Randomizer"

[generate.heading]
note = "generate page h1"
text = "Randomizer"

[generate.tagline]
note = "line under the h1; choose settings, get a seed page to share"
text = "Roll a new seed from given settings"

[generate.mode.label]
note = "label over the course mode select (options follow); what shape of course to roll"
text = "Course Mode"

[generate.mode.standard]
note = "plain: mode option, the default; a standard par 72: four par 3s, ten par 4s, four par 5s"
text = "Standard (Par 72)"

[generate.mode.natural_par]
note = "plain: mode option; par rolled per seed, 68-76, mostly near 72; each par as common as on a standard course"
text = "Natural Par (Par 68-76, mostly near 72)"

[generate.mode.executive]
note = "plain: mode option; short course of par 3s and two to six par 4s (rolled), no par 5s; par 56-60"
text = "Executive Course (Short course, no par 5s)"

[generate.mode.par_3]
note = "plain: mode option; eighteen par 3s, par 54"
text = "Par 3 Course (Par 54)"

[generate.mode.vanilla_course]
note = "plain: mode option; one cartridge course, holes 1-18 in order; pick which below"
text = "Vanilla Course"

[generate.mode.help]
note = "small line under the mode select; vanilla course ignores sources and expert limit"
text = """Mode is the general "Shape" of the course and its distribution of pars."""

[generate.course.label]
note = "label over the vanilla course select, shown only for the vanilla course mode"
text = "Vanilla Game / Course"

[generate.course.option]
note = "plain: one vanilla course option; {course} the course name, {rom} its ROM title"
text = "{rom}: {course}"

[generate.sources.legend]
note = "legend over the source ROM checkboxes (ROM titles beside them); holes come from the checked ROMs; at least one"
text = "Sources"

[generate.family_repeats.label]
note = "switch label; allow two versions of the same hole (e.g. a NES Open hole and its Mario Open twin) on one course"
text = "Allow multiple holes in the same family"

[generate.family_repeats.help]
note = "small line under the switch; off by default; what a repeat looks like"
text = "Some Mario Open courses are the same or similar to NES Open courses. You probably want to keep this turned off."

[generate.draw_rule.label]
note = "label over the draw rule select; how many expert holes (the hardest Mario Open holes) a course may have"
text = "Expert Holes Limit"

[generate.draw_rule.experts_0]
note = "plain: draw rule option; no expert holes on the course"
text = "Zero (None allowed)"

[generate.draw_rule.experts_1]
note = "plain: draw rule option, the default; at most one expert hole on each nine"
text = "One per Nine"

[generate.draw_rule.experts_2]
note = "plain: draw rule option; at most two expert holes on each nine"
text = "Two per Nine"

[generate.draw_rule.uniform]
note = "plain: draw rule option; no limit, every hole equally likely, expert holes included"
text = "No limit"

[generate.draw_rule.help]
note = "small line under the draw rule select; what an expert hole is: a Mario Open hole that plays harder than every NES Open hole"
text = """
An "Expert Hole" is any hole from Mario Open that's been determined to play harder relative to par
than any hole from NES Open.  There are around 20 such holes.
"""

[generate.mirror_chance.label]
note = "label over the select for each hole's chance of being mirrored (flipped left to right); rolled per hole"
text = "Each hole mirrored:"

[generate.hazard_chance.label]
note = "label over the select for each hole's chance of its bunkers and water being reshuffled; rolled per hole"
text = "Each hole hazards shuffled:"

[generate.chance.p0]
note = "plain: transform chance option, the default; 0%, no hole changed"
text = "Off"

[generate.chance.p25]
note = "plain: transform chance option; 25% each hole, on its own; usually 2-8 holes, can be none"
text = "Unlikely"

[generate.chance.p50]
note = "plain: transform chance option; 50% each hole, on its own; usually 6-12 holes"
text = "Coin flip"

[generate.chance.p75]
note = "plain: transform chance option; 75% each hole, on its own; usually 10-16 holes, can be all"
text = "Likely"

[generate.chance.p100]
note = "plain: transform chance option; every hole"
text = "Always"

[generate.chance.help]
note = "small line under the two transform selects; each hole rolled on its own, so a count isn't promised; the seed page shows which holes changed"
text = "Each hole in the course will be rolled for all transforms, so no specific count is guaranteed."

[generate.wind_speed.label]
note = "label over the wind speed select; how strong the wind is across the round (profile names follow)"
text = "Wind Speed Profile"

[generate.wind_direction.label]
note = "label over the wind direction select; which way the wind blows across the round (profile names follow)"
text = "Wind Direction Profile"

[generate.music.label]
note = "label over the course music select"
text = "Course Music"

[generate.music.random]
note = "plain: first music option; the generator picks a theme"
text = "Random"

[generate.music.option]
note = "plain: one music option; {course} the course the theme belongs to, {rom} its ROM title"
text = "{rom}: {course}"

[generate.clubs.heading]
note = "header of the club rules card, set apart inside the form"
text = "Club Restrictions"

[generate.clubs.lead]
note = "club rules card intro; for special events; most seeds leave these alone"
text = """
These settings place restrictions on which or how many clubs players may use.
Most of the time you'll want to leave all of these fields at their default values.
"""

[generate.clubs.max_label]
note = "label for the most clubs a bag may hold, putter included, 1-14"
text = "Maximum number of clubs in bag, including putter"

[generate.clubs.banned_legend]
note = "legend over club checkboxes (1W, 3I, ...); clubs no bag may hold; putter never listed"
text = "Banned Clubs"

[generate.clubs.required_legend]
note = "legend over club checkboxes; the one bag every player carries; none checked = players choose"
text = "Locked Bag"

[generate.clubs.required_help]
note = "small line under required bag; putter always added; must fit the max and hold no banned club"
text = """
Checking any of these checkboxes will require all players to use <em>exactly</em>
the checked clubs, as well as a putter.  You will not have access to any
unchecked clubs.  The limit is 14 clubs, plus the putter.
"""

[generate.mystery_link]
note = "link under the form to the mystery seed page, which rolls a seed from an uploaded request file"
text = "mystery"

[generate.submit]
note = "form submit button; generates the seed and goes to its page"
text = "Randomize"

# Notices over the form when a submission is refused. One shows at a time.

[generate.error.no_sources]
note = "no source ROM checked; check at least one"
text = "You have to choose at least one source of holes for the randomized course."

[generate.error.mode_needs_sources]
note = "a par 3 or executive course with NES Open as its only source, whose holes can't fill one (temporary); check Mario Open too"
text = "Short courses need more sources than just NES Open to generate.  Check Mario Open as well, or choose a different mode."

[generate.error.required_bag_over_max]
note = "required bag larger than the max; {count} clubs with the putter, {max} the max"
text = """
More clubs chosen in the 'Locked Bag' section than the 'Maximum allowed'.
Maximum is set to {max}, you chose {count}."""

[generate.error.required_bag_banned]
note = "required bag includes banned clubs; {clubs} those clubs' labels, space separated"
text = """
When using a Locked Bag, don't set any Banned Clubs."""

[generate.error.invalid]
note = "a value the form can't send (tampered or stale page); {field} the form field name; reload and try again"
text = """
Received an error on form submission.  A refresh might fix it.  If not, ask for help and
mention: <code>generate.error.invalid {field}</code>"""

[generate.error.pool]
note = "the chosen sources can't fill a course of this mode; try more sources or allowing repeats"
text = """
Unable to fill out the course with these sources and this Mode.  Add more sources or
change the requested mode."""

[generate.error.rate_limited]
note = "too many seeds from this address in a short time; wait a minute and try again"
text = "Whoa buddy, slow down a bit.  Maybe grab a drink from the clubhouse before rolling your next seed."

[generate.error.unavailable]
note = "the server can't build seeds right now (its own ROM is missing); not the player's fault; try later"
text = "It's not you, it's me.  Server unable to build seeds right now, check back later."
