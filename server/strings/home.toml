# Home page strings (home.html).
# Format: see common.toml, and server/CLAUDE.md "Player-facing text".

[home.heading]
note = "home page h1"
text = "NES Open Tournament Golf Randomizer"

[home.tagline]
note = "line under the h1; what the site is"
text = """Play a new 18 holes every time you step onto the course."""

[home.latest_update]
note = "a small chip between the about paragraph and the step cards, the whole of it a link to the newest release's card on the Updates page; shown only when that release has a summary; that the site has been updated and what it brought; receives summary (plain text, a few words from the release's frontmatter), version (e.g. v5.0.0) and date (the release date)"
text = "{version} - {summary} ({date})"

[home.about]
note = "paragraph under the tagline; what this project is and what sets it apart: holes from both the US and Japanese games; no definition of a seed, the step cards show it by use"
text = """
Inspired by other randomizer projects like The ALTTP Randomizer, Super Mario World Randomizer, and The Legend of Zelda
Randomizer, this site allows you to patch your copy of NES Open Tournament Golf with a course made up of a random
selection of 18 holes from both the U.S. and Japanese (Mario Open Golf) releases of the game.
"""

[home.step_rom.header]
note = "card 1 of 4, header; set up ROMs"
text = "Get the ROM."

[home.step_rom.body]
note = "card 1 of 4, body; set up ROMs, link /rom; files stay in the browser, only checked for being unmodified"
text = """You'll need a copy of the NES Open Tournament Golf (US)
ROM, and preferably a copy of the Mario Open Golf (Japan) ROM. Currently only
version 1.0 of Mario Open Golf is supported. Verify your ROMs at <a href="/rom">ROM Setup</a>.
Your ROM files never leave your machine."""

[home.step_generate.header]
note = "card 2 of 4, header; generate a seed"
text = "Generate a randomized game."

[home.step_generate.body]
note = "card 2 of 4, body; generate a seed, link /generate; share the seed page"
text = """Head on over to
<a href="/generate">Roll Seed</a>. This screen shows a variety of options. When you're
satisfied, hit the Roll button and it'll take you to the "seed page"."""

[home.step_play.header]
note = "card 3 of 4, header; play"
text = "Get playing!"

[home.step_play.body]
note = "card 3 of 4, body; save the ROM from the seed page; a shared seed link gives the same course, wind and pin positions; what to play it on"
text = """From the seed page, you can save the patched ROM file.
Sending the link to a friend will let them save the same course, with the same wind conditions and pin positions.
You'll need something to run your game on.  An emulator (like <a href="https://www.mesen.ca/">Mesen</a>) is
a good choice. You can also play on original hardware using flash carts."""

[home.step_score.header]
note = "card 4 of 4, header; post your score"
text = "Submit your score."

[home.step_score.body]
note = "card 4 of 4, body; sign in before saving the ROM, guest ROMs show no code; finish all 18 holes; scan the QR code after the final scorecard with a phone; the round appears on the seed page and /me; optionally what's planned (stats, leaderboards)"
text = """
If you <a href="/auth/login">sign in</a> before saving your ROM, the game will display
a QR code at the end of the round. Scanning this code with your
phone will submit your scorecard, and your completed round
will show up on the seed page and on your account page.
Stats, analytics, and leaderboards are coming soon!
"""

[home.daily.heading]
note = "plain: small label above the Daily Seed box's title, which is the day's theme name (as Easy Monday), with the date under it"
text = "Today's Daily Seed"

[home.daily.closes]
note = "in the Daily Seed box, when the daily stops taking rounds; {time} counts down to it in the viewer's language, as \"in 6 hours\" or \"in 40 minutes\" (shown as the UTC time when scripts are off), with the local time on hover"
text = "Closes {time}."

[home.daily.players]
note = "in the Daily Seed box, beside the closing time; {count} how many players have recorded a round on today's daily so far, 0 or 2 and up (1 is home.daily.players_one)"
text = "{count} scorecards submitted so far."

[home.daily.players_one]
note = "as home.daily.players, when exactly one player has recorded a round on today's daily"
text = "1 scorecard submitted so far."

[home.daily.your_round]
note = "in the Daily Seed box, only for a signed-in player who has recorded their own round on today's daily (nothing to spoil); links to that round. {strokes} the round's total, {to_par} against par as +2, E or -1"
text = "You shot {strokes} ({to_par})"

[home.daily.play]
note = "button to the Daily Seed's seed page"
text = "Play"

[home.daily.calendar]
note = "link to the calendar of past dailies, beside the date under the Daily Seed box's title"
text = "Full Calendar"

[home.yesterday.heading]
note = "plain: small label above the previous day's daily box, under the Daily Seed box, as home.daily.heading is above today's; the title under it is that day's theme name (as Windy Wednesday). While it is still open (the first hour of today's window) the box shows home.daily.closes, home.daily.players and home.daily.play like today's; once closed, its top three and how many played"
text = "Yesterday"

[home.yesterday.podium_header]
note = "plain: small label above the previous day's top three once it has closed, saying what the list is and what the number beside each name counts (net Stableford points)"
text = "Top Players, Net Stableford Points"

[home.yesterday.players]
note = "in the previous day's box once it has closed, under its top three; {count} how many players recorded a round on it, 0 or 2 and up (1 is home.yesterday.players_one)"
text = "{count} scorecards submitted."

[home.yesterday.players_one]
note = "as home.yesterday.players, when exactly one player recorded a round on the previous day's daily"
text = "1 scorecard submitted."

[home.yesterday.results]
note = "link at the bottom of the previous day's box once it has closed, to that day's seed page, which has its full standing, skins and rounds"
text = "Full Results"
